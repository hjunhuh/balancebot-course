<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 760 468" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13">
  <rect y="-28" width="760" height="468" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <!-- battery -->
  <rect x="20" y="40" width="130" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="85" y="66" text-anchor="middle" font-weight="700">배터리 2S2P</text>
  <text x="85" y="86" text-anchor="middle">6.4 ~ 8.4 V</text>
  <rect x="20" y="130" width="130" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="85" y="155" text-anchor="middle">전원 스위치</text>
  <line x1="85" y1="100" x2="85" y2="128" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <!-- shield -->
  <rect x="190" y="20" width="360" height="400" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="210" y="44" font-weight="700" fill="#047857">쉴드 PCB</text>
  <rect x="210" y="60" width="150" height="60" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="285" y="84" text-anchor="middle">J5 → D1 1N5822</text>
  <text x="285" y="104" text-anchor="middle">C1 470uF, C2 100nF</text>
  <line x1="150" y1="150" x2="208" y2="95" stroke="#b45309" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="210" y="140" width="150" height="60" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="285" y="164" text-anchor="middle">R1 20k / R2 10k</text>
  <text x="285" y="184" text-anchor="middle">C3 100nF → A0</text>
  <line x1="285" y1="120" x2="285" y2="138" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <rect x="210" y="220" width="150" height="60" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="285" y="244" text-anchor="middle">R3 1k / R4 2k</text>
  <text x="285" y="264" text-anchor="middle">D1(TX) → 3.3 V</text>
  <rect x="210" y="300" width="150" height="50" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="285" y="322" text-anchor="middle">LED D10, 330 Ω</text>
  <text x="285" y="340" text-anchor="middle">버튼 D3 → GND</text>
  <rect x="380" y="60" width="150" height="290" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="455" y="84" text-anchor="middle" font-weight="700">Arduino Uno</text>
  <text x="455" y="104" text-anchor="middle">ATmega328P</text>
  <text x="455" y="140" text-anchor="middle">VIN ← VBAT</text>
  <text x="455" y="164" text-anchor="middle">A0 ← 배터리 감지</text>
  <text x="455" y="188" text-anchor="middle">A4/A5 I2C</text>
  <text x="455" y="212" text-anchor="middle">D0/D1 UART</text>
  <text x="455" y="236" text-anchor="middle">D4~D9 모터 제어</text>
  <text x="455" y="260" text-anchor="middle">D10 LED, D3 버튼</text>
  <text x="455" y="300" text-anchor="middle">5V → 모듈 전원</text>
  <line x1="360" y1="90" x2="378" y2="140" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="170" x2="378" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="378" y1="212" x2="362" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="378" y1="258" x2="362" y2="322" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- modules -->
  <rect x="590" y="40" width="150" height="70" rx="8" fill="#fae8ff" stroke="#a21caf"/>
  <text x="665" y="66" text-anchor="middle" font-weight="700">J3 MPU6050</text>
  <text x="665" y="88" text-anchor="middle">SCL SDA VCC GND</text>
  <rect x="590" y="140" width="150" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="665" y="166" text-anchor="middle" font-weight="700">J2 HC-05</text>
  <text x="665" y="188" text-anchor="middle">TXD RXD VCC GND</text>
  <rect x="590" y="240" width="150" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="665" y="266" text-anchor="middle" font-weight="700">L298N 모듈</text>
  <text x="665" y="288" text-anchor="middle">J4: ENA IN1~4 ENB</text>
  <text x="665" y="310" text-anchor="middle">J6: +12V GND</text>
  <rect x="590" y="360" width="150" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="665" y="390" text-anchor="middle">DC 모터 x2</text>
  <line x1="530" y1="188" x2="588" y2="80" stroke="#a21caf" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="212" x2="588" y2="176" stroke="#0369a1" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="236" x2="588" y2="285" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M360,75 L370,75 L370,-6 L575,-6 L575,305 L588,305" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="665" y1="330" x2="665" y2="358" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="-12" fill="#b45309">VBAT (굵은 배선, L298N 전원)</text>
</svg>
